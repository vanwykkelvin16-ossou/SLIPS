# Render blueprint. `render.com/deploy` reads this and provisions both the web
# service and its database. Secrets marked sync:false are prompted for.
services:
  - type: web
    name: slipsy
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /login
    disk:
      name: slipsy-data
      mountPath: /data
      sizeGB: 10
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: slipsy-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: FILE_SIGNING_SECRET
        generateValue: true
      - key: ADMIN_SESSION_SECRET
        generateValue: true
      # Both must be the service's public HTTPS URL, e.g.
      # https://slipsy.onrender.com — set them after the first deploy
      # tells you the hostname, then redeploy.
      - key: AUTH_URL
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_INITIAL_PASSWORD
        sync: false
      - key: STORAGE_DRIVER
        value: local
      - key: STORAGE_LOCAL_PATH
        value: /data/storage
      - key: OCR_CACHE_PATH
        value: /data/tesseract-cache
      - key: OCR_PROVIDER
        value: tesseract
      - key: EMAIL_PROVIDER
        value: console

databases:
  - name: slipsy-db
    plan: basic-256mb
